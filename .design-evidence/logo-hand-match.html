<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>N vs Y — hand match</title>
<style>
  body{margin:0;padding:28px;background:#fcfcfc;font:13px/1.5 ui-monospace,Menlo,monospace;color:#141414}
  h1{font:600 20px/1.2 system-ui,sans-serif;margin:0 0 4px}
  p.lede{margin:0 0 24px;color:#666}
  h2{font:600 12px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:#888;margin:28px 0 10px;padding-top:12px;border-top:1px solid #e4e4e4}
  .row{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
  .fig{margin:0;text-align:center}
  .fig img{display:block}
  .fig figcaption{font-size:11px;color:#888;margin-top:8px}
  .dark{background:#141414;padding:22px;border-radius:6px}
  .dark .fig figcaption{color:#7a7a7a}
  .big img{width:320px;height:320px}
</style></head>
<body>
  <h1>N and Y, side by side</h1>
  <p class="lede">Same alphabet, same hand? Left of each pair is the hand-drawn N; right is the redrawn Y.</p>

  <h2>Paper ground · large</h2>
  <div class="row big">
    <figure class="fig"><img src="../logo-nablo-bubble.svg" alt="N"><figcaption>N — logo-nablo-bubble.svg · 320px</figcaption></figure>
    <figure class="fig"><img src="../logo-nablo-y.svg" alt="Y"><figcaption>Y — logo-nablo-y.svg · 320px</figcaption></figure>
  </div>

  <h2>Paper ground · 120 / 64 / 26 px</h2>
  <div class="row">
    <figure class="fig"><img src="../logo-nablo-bubble.svg" width="120" height="120" alt="N 120"><figcaption>N 120</figcaption></figure>
    <figure class="fig"><img src="../logo-nablo-y.svg" width="120" height="120" alt="Y 120"><figcaption>Y 120</figcaption></figure>
    <figure class="fig"><img src="../logo-nablo-bubble.svg" width="64" height="64" alt="N 64"><figcaption>N 64</figcaption></figure>
    <figure class="fig"><img src="../logo-nablo-y.svg" width="64" height="64" alt="Y 64"><figcaption>Y 64</figcaption></figure>
    <figure class="fig"><img src="../logo-nablo-bubble.svg" width="26" height="26" alt="N 26"><figcaption>N 26</figcaption></figure>
    <figure class="fig"><img src="../logo-nablo-y.svg" width="26" height="26" alt="Y 26"><figcaption>Y 26</figcaption></figure>
  </div>

  <h2>Dark ground · 120 / 64 / 26 px</h2>
  <div class="dark">
    <div class="row">
      <figure class="fig"><img src="../logo-nablo-bubble.svg" width="120" height="120" alt="N 120 dark"><figcaption>N 120</figcaption></figure>
      <figure class="fig"><img src="../logo-nablo-y.svg" width="120" height="120" alt="Y 120 dark"><figcaption>Y 120</figcaption></figure>
      <figure class="fig"><img src="../logo-nablo-bubble.svg" width="64" height="64" alt="N 64 dark"><figcaption>N 64</figcaption></figure>
      <figure class="fig"><img src="../logo-nablo-y.svg" width="64" height="64" alt="Y 64 dark"><figcaption>Y 64</figcaption></figure>
      <figure class="fig"><img src="../logo-nablo-bubble.svg" width="26" height="26" alt="N 26 dark"><figcaption>N 26</figcaption></figure>
      <figure class="fig"><img src="../logo-nablo-y.svg" width="26" height="26" alt="Y 26 dark"><figcaption>Y 26</figcaption></figure>
    </div>
  </div>
</body></html>
