<svg viewBox="0 0 920 1020" xmlns="http://www.w3.org/2000/svg" style="background: #080808; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#222222" opacity="0.8"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c5ff41"/>
    </marker>
  </defs>

  <rect width="920" height="1020" fill="url(#grid)" rx="8"/>

  <!-- Title -->
  <text x="460" y="48" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">How I handle an escalation</text>
  <text x="460" y="70" text-anchor="middle" fill="#8E8E93" font-size="12">Listen → Clarify → Investigate → Act → Confirm</text>

  <!-- Example message -->
  <rect x="180" y="96" width="560" height="96" rx="8" fill="#111111" stroke="#333333" stroke-width="1"/>
  <text x="200" y="122" fill="#c5ff41" font-size="10" font-weight="700" letter-spacing="0.06em">RECREATED EXAMPLE — SAMPLE DATA</text>
  <text x="200" y="146" fill="#ffffff" font-size="14" font-weight="600">“I want to terminate my account.</text>
  <text x="200" y="166" fill="#ffffff" font-size="14" font-weight="600">Nobody is helping me.”</text>

  <!-- Connectors + steps -->
  <path d="M 460 192 L 460 224" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arr)"/>

  <!-- Step 1 -->
  <rect x="180" y="224" width="560" height="110" rx="8" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="200" y="252" fill="#c5ff41" font-size="11" font-weight="700">1 · LISTEN</text>
  <text x="200" y="276" fill="#ffffff" font-size="14" font-weight="600">Acknowledge the frustration first</text>
  <text x="200" y="298" fill="#8E8E93" font-size="12">Don't argue or defend. Let the vendor explain fully.</text>
  <text x="200" y="316" fill="#8E8E93" font-size="12">Keep tone calm and professional throughout.</text>

  <path d="M 460 334 L 460 362" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="180" y="362" width="560" height="110" rx="8" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="200" y="390" fill="#c5ff41" font-size="11" font-weight="700">2 · CLARIFY</text>
  <text x="200" y="414" fill="#ffffff" font-size="14" font-weight="600">Find the real issue</text>
  <text x="200" y="436" fill="#8E8E93" font-size="12">Billing? Hardware? Orders? Account settings? Service quality?</text>
  <text x="200" y="454" fill="#8E8E93" font-size="12">Ask one clear question at a time.</text>

  <path d="M 460 472 L 460 500" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="180" y="500" width="560" height="110" rx="8" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="200" y="528" fill="#c5ff41" font-size="11" font-weight="700">3 · INVESTIGATE</text>
  <text x="200" y="552" fill="#ffffff" font-size="14" font-weight="600">Check before promising</text>
  <text x="200" y="574" fill="#8E8E93" font-size="12">Account info · past chats · order and rider status · invoice details.</text>
  <text x="200" y="592" fill="#8E8E93" font-size="12">Verify sensitive details following security steps.</text>

  <path d="M 460 610 L 460 638" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="180" y="638" width="560" height="110" rx="8" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="200" y="666" fill="#c5ff41" font-size="11" font-weight="700">4 · ACT</text>
  <text x="200" y="690" fill="#ffffff" font-size="14" font-weight="600">Fix what you can, route the rest</text>
  <text x="200" y="712" fill="#8E8E93" font-size="12">Resolve immediately when possible (cancel, correct, update, retry).</text>
  <text x="200" y="730" fill="#8E8E93" font-size="12">Coordinate with the right team for hardware or policy cases.</text>

  <path d="M 460 748 L 460 776" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arr)"/>

  <!-- Step 5 -->
  <rect x="180" y="776" width="560" height="110" rx="8" fill="#161616" stroke="#c5ff41" stroke-width="1.2"/>
  <text x="200" y="804" fill="#c5ff41" font-size="11" font-weight="700">5 · CONFIRM</text>
  <text x="200" y="828" fill="#ffffff" font-size="14" font-weight="600">Close the loop clearly</text>
  <text x="200" y="850" fill="#8E8E93" font-size="12">Explain what was done, what happens next, and document in CRM.</text>
  <text x="200" y="868" fill="#8E8E93" font-size="12">Check the vendor understood before ending the chat.</text>

  <!-- Footer note -->
  <text x="460" y="922" text-anchor="middle" fill="#636366" font-size="11">Based on Ibex vendor support: cancellations · breakdowns · rider follow-ups · invoice help · device issues · retention</text>
  <text x="460" y="942" text-anchor="middle" fill="#636366" font-size="11">Illustrative example — no real customer data, accounts, or amounts shown.</text>
  <text x="460" y="972" text-anchor="middle" fill="#c5ff41" font-size="11" font-weight="600">Up to 4 live chats · Top Agent 2023 · Chat Warrior 2023</text>
</svg>
