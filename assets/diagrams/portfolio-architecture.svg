<svg viewBox="0 0 920 900" xmlns="http://www.w3.org/2000/svg" style="background: #080808; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, monospace;">
  <!-- ======================================================================= -->
  <!-- HAZIEL NABLO — VENDOR ESCALATIONS & CX PIPELINE ARCHITECTURE (LAVISH 2.7) -->
  <!-- ======================================================================= -->

  <defs>
    <!-- Dark pitch dot grid -->
    <pattern id="lavish-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#222222" opacity="0.8"/>
    </pattern>

    <!-- Electric Lime Arrowhead (Happy Path) -->
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c5ff41"/>
    </marker>

    <!-- Warm Amber Arrowhead (Critical Churn / Hardware Escalation) -->
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f46c38"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="900" fill="url(#lavish-grid)" rx="8"/>

  <!-- ======================================================================= -->
  <!-- LAYER 1: REGION BOUNDARIES (Stage Separations)                          -->
  <!-- ======================================================================= -->
  <!-- STAGE 1: INBOUND TRIAGE & QUEUE ALLOCATION -->
  <rect x="230" y="24" width="460" height="150" rx="4" fill="#111111" fill-opacity="0.85" stroke="#262626" stroke-width="1"/>

  <!-- STAGE 2: 4-CHAT CONCURRENT OPERATIONS ENGINE -->
  <rect x="30" y="230" width="860" height="205" rx="4" fill="#111111" fill-opacity="0.85" stroke="#262626" stroke-width="1"/>

  <!-- STAGE 3: TIER-2 ESCALATION & CHURN MITIGATION -->
  <rect x="30" y="500" width="860" height="155" rx="4" fill="#111111" fill-opacity="0.85" stroke="#262626" stroke-width="1"/>

  <!-- STAGE 4: RETENTION, COMPLIANCE & SLA RESOLUTION -->
  <rect x="30" y="720" width="860" height="150" rx="4" fill="#111111" fill-opacity="0.85" stroke="#262626" stroke-width="1"/>

  <!-- ======================================================================= -->
  <!-- LAYER 2: CONNECTOR ARROWS (Behind boxes and badges)                      -->
  <!-- ======================================================================= -->
  <!-- S1: Inbound to Load Balancer -->
  <path d="M 460 92 L 460 114" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arrow-lime)"/>

  <!-- S1 -> S2: Dispatch to 4-Chat Concurrency Core -->
  <path d="M 460 162 L 460 258" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arrow-lime)"/>

  <!-- S2: Concurrency Hub splits into 3 Parallel Operational Lanes -->
  <path d="M 350 285 L 160 285 L 160 350" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arrow-lime)"/>
  <path d="M 460 310 L 460 350" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arrow-lime)"/>
  <path d="M 570 285 L 750 285 L 750 350" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arrow-lime)"/>

  <!-- S2 -> S3: 3 Streams flow to Tier-2 Resolution Layer -->
  <path d="M 160 405 L 160 550" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arrow-lime)"/>
  <path d="M 460 405 L 460 550" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arrow-lime)"/>
  <path d="M 750 405 L 750 550" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arrow-lime)"/>

  <!-- Severe Escalation / Churn Risk Highway (Outer Right: X = 875) -->
  <path d="M 855 380 L 875 380 L 875 790 L 825 790" fill="none" stroke="#f46c38" stroke-width="1.75" stroke-dasharray="4 4" marker-end="url(#arrow-amber)"/>

  <!-- S3 -> S4: Convergence into Final Retention & SLA Core -->
  <path d="M 160 605 L 160 680 L 325 790" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arrow-lime)"/>
  <path d="M 460 605 L 460 765" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arrow-lime)"/>
  <path d="M 750 605 L 750 680 L 595 790" fill="none" stroke="#c5ff41" stroke-width="1.75" marker-end="url(#arrow-lime)"/>

  <!-- ======================================================================= -->
  <!-- LAYER 3: COMPONENT NODES                                                -->
  <!-- ======================================================================= -->

  <!-- S1: Top Node (Merchant & Inbound Influx) -->
  <rect x="330" y="44" width="260" height="48" rx="3" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="460" y="64" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Merchant &amp; Vendor Intake</text>
  <text x="460" y="80" text-anchor="middle" fill="#8E8E93" font-size="10">Real-Time Inquiries • Cancellation Requests</text>

  <!-- S1: Bottom Node (Queue Allocation) -->
  <rect x="330" y="114" width="260" height="48" rx="3" fill="#161616" stroke="#c5ff41" stroke-width="1.2"/>
  <text x="460" y="134" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Concurrency Load Balancer</text>
  <text x="460" y="150" text-anchor="middle" fill="#c5ff41" font-size="10">Allocating 4 Simultaneous Active Chats</text>

  <!-- S2: Top Router Node (Haziel Nablo Desk Core) -->
  <rect x="330" y="260" width="260" height="50" rx="3" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="460" y="281" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Chat Warrior Resolution Engine</text>
  <text x="460" y="297" text-anchor="middle" fill="#8E8E93" font-size="10">Haziel Nablo • Top Agent 2023</text>

  <!-- S2: Left Lane (Order & Rider Dispatch) -->
  <rect x="55" y="350" width="210" height="55" rx="3" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="160" y="372" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Order &amp; Rider Tracking</text>
  <text x="160" y="388" text-anchor="middle" fill="#8E8E93" font-size="10">Cancellation • Driver ETA Follow-up</text>

  <!-- S2: Center Lane (Invoicing & VAT Audits) -->
  <rect x="350" y="350" width="220" height="55" rx="3" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="460" y="372" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Invoice &amp; Deduction Audits</text>
  <text x="460" y="388" text-anchor="middle" fill="#8E8E93" font-size="10">Gross Revenue • VAT • Fee Clarification</text>

  <!-- S2: Right Lane (Hardware & Device Support) -->
  <rect x="645" y="350" width="210" height="55" rx="3" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="750" y="372" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Device Troubleshooting</text>
  <text x="750" y="388" text-anchor="middle" fill="#8E8E93" font-size="10">POS Diagnostics • Hardware Swaps</text>

  <!-- S3: Left Lane (Dispatch Resolution) -->
  <rect x="55" y="550" width="210" height="55" rx="3" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="160" y="572" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Fulfillment Stabilization</text>
  <text x="160" y="588" text-anchor="middle" fill="#8E8E93" font-size="10">Rider Reassignment • SLA Saved</text>

  <!-- S3: Center Lane (Account Retention & Churn Mitigation) -->
  <rect x="350" y="550" width="220" height="55" rx="3" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="460" y="572" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Merchant Retention Desk</text>
  <text x="460" y="588" text-anchor="middle" fill="#8E8E93" font-size="10">Termination Halts • De-escalation</text>

  <!-- S3: Right Lane (Confidential Data Security) -->
  <rect x="645" y="550" width="210" height="55" rx="3" fill="#161616" stroke="#262626" stroke-width="1"/>
  <text x="750" y="572" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Data &amp; Banking Updates</text>
  <text x="750" y="588" text-anchor="middle" fill="#8E8E93" font-size="10">Bank Info Security • Store Name</text>

  <!-- S4: Convergence Hub (Final SLA & Retention Closed-Loop) -->
  <rect x="325" y="765" width="270" height="58" rx="3" fill="#161616" stroke="#c5ff41" stroke-width="1.2"/>
  <text x="460" y="788" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Account Retained &amp; Closed-Loop</text>
  <text x="460" y="806" text-anchor="middle" fill="#c5ff41" font-size="10">5-Star CSAT Rating • CRM Case Audited</text>

  <!-- ======================================================================= -->
  <!-- LAYER 4: STAGE TITLE BADGES                                             -->
  <!-- ======================================================================= -->
  <g>
    <rect x="245" y="16" width="165" height="18" rx="2" fill="#1e1e1e" stroke="#333333" stroke-width="1"/>
    <text x="253" y="29" fill="#c5ff41" font-size="9" font-weight="700" letter-spacing="0.05em">STAGE 1: QUEUE TRIAGE</text>
  </g>
  <g>
    <rect x="45" y="222" width="210" height="18" rx="2" fill="#1e1e1e" stroke="#333333" stroke-width="1"/>
    <text x="53" y="235" fill="#c5ff41" font-size="9" font-weight="700" letter-spacing="0.05em">STAGE 2: 4-CHAT CONCURRENCY</text>
  </g>
  <g>
    <rect x="45" y="492" width="195" height="18" rx="2" fill="#1e1e1e" stroke="#333333" stroke-width="1"/>
    <text x="53" y="505" fill="#c5ff41" font-size="9" font-weight="700" letter-spacing="0.05em">STAGE 3: TIER-2 ESCALATION</text>
  </g>
  <g>
    <rect x="45" y="712" width="180" height="18" rx="2" fill="#1e1e1e" stroke="#333333" stroke-width="1"/>
    <text x="53" y="725" fill="#c5ff41" font-size="9" font-weight="700" letter-spacing="0.05em">STAGE 4: SLA RETENTION</text>
  </g>

  <!-- ======================================================================= -->
  <!-- LAYER 5: PROTECTED BADGE SHIELDS (4px Margin Box-Shadow Guard)           -->
  <!-- Shared Y-Baseline 1: Y = 195                                            -->
  <!-- Shared Y-Baseline 2: Y = 465                                            -->
  <!-- Shared Y-Baseline 3: Y = 685                                            -->
  <!-- ======================================================================= -->

  <!-- Baseline 1: Ingestion -> 4-Chat Engine -->
  <g transform="translate(460, 195)">
    <rect x="-65" y="-10" width="130" height="20" rx="3" fill="#080808" stroke="#333333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">&lt;30s First Response</text>
  </g>

  <!-- Baseline 2: S2 -> S3 (Aligned at Y = 465) -->
  <g transform="translate(160, 465)">
    <rect x="-55" y="-10" width="110" height="20" rx="3" fill="#080808" stroke="#333333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#8E8E93" font-size="10" font-weight="600">Rider Contacted</text>
  </g>
  <g transform="translate(460, 465)">
    <rect x="-60" y="-10" width="120" height="20" rx="3" fill="#080808" stroke="#333333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#c5ff41" font-size="10" font-weight="600">De-escalated</text>
  </g>
  <g transform="translate(750, 465)">
    <rect x="-55" y="-10" width="110" height="20" rx="3" fill="#080808" stroke="#333333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#8E8E93" font-size="10" font-weight="600">Verified Secure</text>
  </g>

  <!-- Baseline 3: S3 -> S4 (Aligned at Y = 685) -->
  <g transform="translate(160, 685)">
    <rect x="-55" y="-10" width="110" height="20" rx="3" fill="#080808" stroke="#333333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#8E8E93" font-size="10" font-weight="600">Order Resolved</text>
  </g>
  <g transform="translate(460, 685)">
    <rect x="-60" y="-10" width="120" height="20" rx="3" fill="#080808" stroke="#333333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#c5ff41" font-size="10" font-weight="600">Churn Prevented</text>
  </g>
  <g transform="translate(750, 685)">
    <rect x="-55" y="-10" width="110" height="20" rx="3" fill="#080808" stroke="#333333" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#8E8E93" font-size="10" font-weight="600">Profile Updated</text>
  </g>

  <!-- Churn Escalation Badge on Outer Highway -->
  <g transform="translate(875, 570)">
    <rect x="-45" y="-10" width="90" height="20" rx="3" fill="#080808" stroke="#f46c38" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#f46c38" font-size="9" font-weight="700">Urgent Churn Alert</text>
  </g>
</svg>
