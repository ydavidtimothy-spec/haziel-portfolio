<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Haziel Nablo logo">
  <title>HN disc mark, small</title>
  <defs>
    <filter id="hnSmShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Flat two-tone: no blur, no gradient, no borders -->
  <circle cx="48" cy="48" r="34" fill="#7a3cff"/>
  <text x="48" y="63" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold"
        fill="#ffffff" filter="url(#hnSmShadow)">N</text>
</svg>
